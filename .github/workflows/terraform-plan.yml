name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'providers/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yml'
  push:
    branches: [main]
    paths:
      - 'providers/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/terraform-plan.yml'

  workflow_dispatch:

jobs:
  plan:
    name: Terraform Plan
    # Untrusted PRs get credential-free checks in terraform-validate.yml.
    if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.5"
          terraform_wrapper: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          scripts/tf-all.sh plan ci-plan 2>&1 | tee plan_output.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$PLAN_EXIT" >> "$GITHUB_OUTPUT"
          # Exit 2 = changes detected (not an error for plan workflow)
          case "$PLAN_EXIT" in
            0|2) exit 0 ;;
            *) exit 1 ;;
          esac

      - name: Post Plan Comment
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.exit_code != ''
        uses: actions/github-script@v7
        env:
          PLAN_EXIT_CODE: ${{ steps.plan.outputs.exit_code }}
        with:
          script: |
            const exitCode = process.env.PLAN_EXIT_CODE;
            const planOutput = require('fs').readFileSync('plan_output.txt', 'utf8').trim();
            const status = exitCode === '0' ? '✅ No changes' :
                           exitCode === '2' ? '⚠️ Changes detected' : '❌ Error';

            const maxLength = 60000;
            const truncated = planOutput.length > maxLength
              ? planOutput.substring(0, maxLength) + '\n\n... output truncated (exceeded 60,000 chars)'
              : planOutput;

            const body = [
              `### ${status}: Terraform Plan`,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>'
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
